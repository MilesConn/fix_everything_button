[project]
name = "fix-everything-button"
version = "0.1.0"
description = "Make Room for San Francisco — a transit-oriented upzoning capacity and rent-impact model (SF replication of the NYT/PAU study)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "geopandas>=1.0,<2",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "shapely>=2.0,<3",
    "pyproj>=3.6",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "r5py>=0.1.1",
    "tqdm>=4.66",
]

[tool.uv]
package = false
